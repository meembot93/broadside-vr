<!doctype html>
<html><head><meta charset="utf-8"><title>Rigged pirates</title>
<style>html,body{margin:0;height:100%;background:#7f8a93;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.js", "three/addons/": "../lib/addons/" } }</script>
</head><body>
<script type="module">
// Dev page: the high-detail (rigged) pirates side by side, animated.
// ?types=buccaneer,raider,rogue  ?kids  ?pose=steer|haul|ram|aim|point|sit|row|walk|attack|cheer|dead
// ?view=front|back|side|close  ?i=N (close-up of the Nth)  ?t=seconds to run before the picture
import * as THREE from 'three';
import { makePerson, animatePerson, PEOPLE } from '../js/people.js';
import { loadModels } from '../js/rigged.js';
const q = new URLSearchParams(location.search);
PEOPLE.adult = !q.has('kids');
await loadModels();
const view = q.get('view') || 'front', pose = q.get('pose') || '';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87a4b8);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x6a5a48, 1.6));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); sun.position.set(-3, 6, -5); scene.add(sun);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0x9a7a52 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const list = (q.get('types') || 'buccaneer,raider,rogue').split(',');
const people = list.map((t, i) => {
  const p = makePerson({ type: t, seed: 100 + i, cutlass: pose === 'attack' || q.has('sword') });
  p.g.position.x = (i - (list.length - 1) / 2) * 1.0; scene.add(p.g);
  if (pose && !['walk', 'attack', 'cheer', 'dead'].includes(pose)) p.pose = pose;
  return p;
});
let tri = 0; scene.traverse((o) => { if (o.isMesh && o !== floor) tri += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; });
window.stats = { tri: Math.round(tri / people.length) };
const W = (list.length * 1.0) / 2 + 0.6;
const views = { front: [0, 1.0, -W * 2.3, 0, 0.9, 0], back: [0, 1.0, W * 2.3, 0, 0.9, 0], side: [-W * 2.0, 1.0, -W * 1.0, 0, 0.9, 0], close: [0, 1.55, -1.5, 0, 1.45, 0] };
const v = views[view]; cam.position.set(v[0], v[1], v[2]); cam.lookAt(v[3], v[4], v[5]);
if (view === 'close') { const p = people[+(q.get('i') || 0)]; cam.position.x = p.g.position.x; cam.lookAt(p.g.position.x, 1.45, 0); }
// Run the animation for ?t seconds (fixed steps), then draw
const T = +(q.get('t') || 1.2), dt = 1 / 60;
let t = 0;
for (; t < T; t += dt) for (const p of people) {
  if (pose === 'walk') p.g.position.z -= dt * 1.3;
  if (pose === 'attack' && p.attack < 0 && t > 0.2) p.attack = 0;
  if (pose === 'cheer') p.cheer = 1;
  if (pose === 'dead') p.dead = true;
  animatePerson(p, dt, pose === 'walk', t);
}
if (pose === 'walk') { cam.position.z -= T * 1.3; }
renderer.render(scene, cam); window.done = true;
</script></body></html>
