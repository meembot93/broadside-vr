<!doctype html>
<html><head><meta charset="utf-8"><title>Pirate lineup</title>
<style>html,body{margin:0;height:100%;background:#7f8a93;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.js", "three/addons/": "../lib/addons/" } }</script>
</head><body>
<script type="module">
// Dev page: shows every pirate type side by side, plus the weapons. Open tools/lineup.html.
// ?view=front|back|side|close  ?seed=N
import * as THREE from 'three';
import { makePerson, PIRATE_TYPES, PEOPLE } from '../js/people.js';
PEOPLE.adult = true;
import { Kit, addCutlass, addMusket } from '../js/kit.js';
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'front', seed = +(q.get('seed') || 1);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87a4b8);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x6a5a48, 1.6));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); sun.position.set(-3, 6, -5); scene.add(sun);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0x9a7a52 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const list = q.get('types') ? q.get('types').split(',') : PIRATE_TYPES;
const people = list.map((t, i) => { const p = makePerson({ type: t, seed: seed * 100 + i, cutlass: i % 2 === 0 }); p.g.position.x = (i - (list.length - 1) / 2) * 0.95; scene.add(p.g); return p; });
let tri = 0, calls = 0; scene.traverse((o) => { if (o.isMesh && o !== floor) { tri += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; calls++; } });
window.stats = { tri: Math.round(tri / people.length), calls: calls / people.length };
const k = new Kit(); addCutlass(k, 0.8, [0, 0, 0]); const sw = k.mesh(); sw.rotation.y = Math.PI / 2; sw.position.set(-1.2, 0.3, -1.2);
const k2 = new Kit(); addMusket(k2); const mu = k2.mesh(); mu.rotation.y = Math.PI / 2; mu.position.set(0.9, 0.3, -1.2);
if (view === 'weapons') {
  for (const p of people) p.g.visible = false;
  sw.position.set(0.1, 1.25, 0); mu.position.set(0.25, 0.85, 0); mu.rotation.y = -Math.PI / 2; mu.rotation.z = 0; sw.rotation.y = -Math.PI / 2;
  const sw2 = sw.clone(); sw2.position.set(-0.5, 1.45, 0.3); sw2.rotation.set(0.6, 0.4, 0.3);
  const mu2 = mu.clone(); mu2.position.set(-0.4, 0.55, 0.3); mu2.rotation.set(0, -2.3, 0.2);
  scene.add(sw, mu, sw2, mu2);
}
const W = (list.length * 0.95) / 2 + 0.6;
const views = { front: [0, 1.0, -W * 2.3, 0, 0.95, 0], back: [0, 1.0, W * 2.3, 0, 0.95, 0], side: [-W * 2.0, 1.0, -W * 1.0, 0, 0.95, 0], close: [0.0, 1.65, -1.6, 0, 1.55, 0], weapons: [-0.2, 1.1, -3.4, -0.2, 1.0, 0] };
const v = views[view]; cam.position.set(v[0], v[1], v[2]); cam.lookAt(v[3], v[4], v[5]);
if (view === 'close') { const p = people[+(q.get('i') || 0)]; cam.position.x = p.g.position.x; cam.lookAt(p.g.position.x, 1.6, 0); }
renderer.render(scene, cam); window.done = true;
</script></body></html>
